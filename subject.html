<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>/* clean URL  /subject/DS-2026-2027/materials : make every relative file (style.css, app.js ...) resolve from the site root */
  (function () { var p = location.pathname, i = p.indexOf('/subject'); document.write('<base href="' + (i >= 0 ? p.slice(0, i + 1) : p.replace(/[^\/]*$/, '')) + '">'); })();</script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Subject · Gaddam Venu</title>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="top" id="top"></header>
    <main id="main"></main>
    <div class="foot">© Gaddam Venu · Developed by Gaddam Venu</div>
  </div>
</div>
<div id="modal" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="shell.js"></script>
<script src="export.js"></script>
<script src="marks.js"></script>
<script>
/* URL:  /subject/DS-2026-2027/materials   (old links  subject.html?id=...#materials  still work and are rewritten to the clean form) */
const URLSUB = (() => {
  const m = location.pathname.match(/\/subject\/([^\/]+)(?:\/([^\/]+))?\/?$/);
  const q = new URLSearchParams(location.search);                                   // local form:  subject.html?code=DS-2026-2027&tab=marks
  return m ? { code: decodeURIComponent(m[1]).toUpperCase(), tab: m[2] || '' } : q.get('code') ? { code: q.get('code').toUpperCase(), tab: q.get('tab') || location.hash.slice(1) } : { id: q.get('id'), tab: location.hash.slice(1) };
})();
let sid = null;
/* the 3 "Drive link" sections share one table (materials); the category decides where a link is shown */
const SYL_CATS = ['Theory Syllabus','Lab Syllabus','Other Syllabus'];                              // Syllabus (Lab Syllabus only for Theory + Lab)
const LP_CATS = ['Theory Lesson Plan','Lab Lesson Plan'];                         // Lesson Plan (Lab Lesson Plan only for Theory + Lab)
const MAT_CATS = ['Unit 1','Unit 2','Unit 3','Unit 4','Unit 5','Unit 6'];        // Materials
const MARK_CATS = ['Mid 1','Mid 2','AAT1','AAT2'];                                // Marks Share
const LABSHEET_CATS = ['Lab Marks'];                                             // Lab Sheet (Theory + Lab only)
const ADM = ROLE == 'admin', STU = ROLE == 'student';
let C, ST = [], CRS = [], tab = '', showPw = false, q = '';
/* ---------- v41: visible = true / false.  The admin right-clicks (phone: long-press) a TAB or a CARD, types true or false, Update.
   false = students and CR do not get it at all (the database does not send it); the admin still sees it, dimmed with a "visible = false" label. ---------- */
const hiddenTab = id => ((C && C.subject && C.subject.hidden_tabs) || []).includes(id);
const vkAttr = (kind, o) => ADM ? ' data-vk="' + kind + '" data-vid="' + o.id + '" data-vis="' + (o.visible === false ? 'false' : 'true') + '"' : '';
const vkCls = o => ADM && o.visible === false ? ' vhid' : '';
const vkTab = id => ADM && id != 'students' && id != 'crs' ? ' data-vk="tab" data-vid="' + id + '" data-vis="' + (hiddenTab(id) ? 'false' : 'true') + '"' : '';
/* ---------- lab batches (v30): Batch 1 / Batch 2 of a Theory + Lab subject.  BT = { colors, rows:[{student_id, regno, batch}] } or null (not available) ---------- */
let BT = null, LBF = '';                                                      // LBF = batch filter on the Lab Programs list ('' = all, '1', '2')
const BCOL = { 1: '#2563eb', 2: '#f59e0b' };                                  // default batch colors (blue, yellow)
async function loadBatches() { BT = null; if (C.subject.kind != 'lab') return; try { BT = await T('batches_get', { sid }); } catch (e) { BT = null; } }
const bCol = n => (BT && BT.colors && /^#[0-9a-f]{6}$/i.test(BT.colors[n] || '')) ? BT.colors[n] : BCOL[n];
const bRegs = n => (BT ? BT.rows : []).filter(r => r.batch == n).map(r => r.regno);
const bOfStudent = id => { const r = BT && BT.rows.find(x => x.student_id == id); return r ? r.batch : null; };
const bPill = (n, txt) => n ? '<span class="bpill" style="--bc:' + bCol(n) + ';--bi:' + inkOn(bCol(n)) + '">' + (txt || 'Batch ' + n) + '</span>' : '<span class="bpill all">All students</span>';

/* tabs depend on the subject type:  Theory only = Students, Materials, Video Lessons, Marks Share, Notices
                                      Theory + Lab = the same + Lab Programs + Lab Sheet  (v20: Students, Syllabus, Lesson Plan come first) */
const PJ = () => isProj(C.subject.kind);
let PT = null, FM = [], WK = [];            // project: teams, formats, work posts
let EL = [], LM = [], MT = [];               // v46: exam links, lab manuals, zoom meetings  (null = SQL file 08_upgrade_v46.sql not run yet)
const MAT_ALL = MAT_CATS.concat(['Other']);      // v46: Materials = Unit 1-6 + Other (the admin types the name)
const EXK = { lab: 'Lab exam', theory: 'Theory exam' };                      // only Theory exam and Lab exam
const tabs = () => (PJ() ? [['students','Students'],['teams','Teams'],['formats','Formats'],['notices','Notices'],['tasks','Tasks'],['work','Submit Work'],['exams','Exams'],['meetings','Zoom Meeting'],['crs','CR']] :
    [['students','Students'],['syllabus','Syllabus'],['lessonplan','Lesson Plan'],['materials','Materials'],['videos','Video Lessons'],['marks','Theory Marks'],['notices','Notices'],['tasks','Tasks'],['work','Submit Work'],['exams','Exams'],
    ['labs','Lab Programs'],['labmanual','Lab Manual'],['labsheet','Lab Marks'],['meetings','Zoom Meeting'],['crs','CR']])
  .filter(t => (t[0] != 'labs' && t[0] != 'labsheet' && t[0] != 'labmanual') || C.subject.kind == 'lab')
  .filter(t => STU ? t[0] != 'students' && t[0] != 'crs' : ADM || t[0] != 'crs')
  .filter(t => ADM || !hiddenTab(t[0]));                                      // v41: tabs the admin set to visible = false

async function load() {
  C = await T('subject_content', { sid });
  if (!STU) ST = await T('subject_students', { sid });
  if (ADM) CRS = await T('cr_list', { sid });
  await loadBatches();
  const safe = (f, a) => T(f, a).catch(() => null);                      // null = the SQL file 08_upgrade_v46.sql has not been run yet
  [EL, LM, MT] = await Promise.all([safe('examlinks_get', { sid }), C.subject.kind == 'lab' ? safe('labmanual_get', { sid }) : [], safe('meetings_get', { sid })]);
  if (PJ()) [PT, FM, WK] = await Promise.all([T('teams_get', { sid }), T('formats_get', { sid }), T('work_get', { sid })]);
  else WK = await T('work_get', { sid });
  draw();
}
function draw() {
  const inCats = c => C.materials.filter(m => c.includes(m.category)).length;
  const n = { students: ST.length, syllabus: inCats(SYL_CATS), lessonplan: inCats(LP_CATS), materials: inCats(MAT_ALL), marks: '', labsheet: '', notices: C.notices.length, tasks: C.tasks || 0, teams: PT ? PT.teams.length : 0, exams: (EL || []).length, labmanual: (LM || []).length, meetings: (MT || []).length, formats: FM.length, work: WK.length, labs: C.labs.length, videos: C.videos.length, crs: CRS.length };
  const TABS = tabs();
  if (!tab || !TABS.some(t => t[0] == tab)) tab = URLSUB.tab || '';
  if (!TABS.some(t => t[0] == tab)) tab = TABS[0][0];
  $('#main').innerHTML =
    '<div class="subhead"><h2>' + esc(C.subject.code) + ' <span class="pill ' + (C.subject.kind == 'lab' || PJ() ? 'ok' : '') + ' kind">' + KINDS[C.subject.kind] + '</span></h2><p>' + esc(C.subject.full_name || '') + (ROLE == 'cr' ? ' · you can add students here' : '') + '</p>' +
      (ADM ? '<p class="sm vk-tip">Right-click a tab or a card (phone: press and hold) to set <b>visible = true / false</b> for the students.</p>' : '') + '</div>' +
    '<div class="sub2"><div class="subbar">' + TABS.map(t => '<button class="' + (t[0] == tab ? 'on' : '') + (ADM && hiddenTab(t[0]) ? ' vhid' : '') + '"' + vkTab(t[0]) + ' onclick="go(\'' + t[0] + '\')">' + t[1] + (n[t[0]] === '' ? '' : ' <i>' + n[t[0]] + '</i>') + '</button>').join('') + '</div>' +
    '<div id="pane"></div></div>';
  V[tab]();
  urlSync();
}
function urlSync() {                         // keep the address bar clean:  /subject/DS-2026-2027/materials
  if (!/^https?:/.test(location.protocol)) return;
  try { history.replaceState(null, '', subUrl(C.subject.code, tab)); document.title = C.subject.code + ' · Gaddam Venu'; } catch (e) {}
}
function go(t) { tab = t; draw(); }

/* v41: the small window that opens on right-click / long-press (admin only) */
let VKM = null, VKT = 0, VKS = '', VKL = null;       // VKT / VKS = when and how the menu was opened last (a phone press-and-hold must not open it twice)
function vkClose() { if (VKM) { VKM.remove(); VKM = null; } }
function vkOpen(el, x, y, src) {
  vkClose(); VKT = Date.now(); VKS = src || 'mouse';
  const kind = el.dataset.vk, id = el.dataset.vid, cur = el.dataset.vis != 'false';
  const m = document.createElement('div'); m.className = 'vkmenu'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', 'Visible to students');
  m.innerHTML = '<b>Visible to students?</b><span class="sm">' + (kind == 'tab' ? 'This tab' : 'This card') + ' is now <b>visible = ' + cur + '</b></span>' +
    '<div class="vk-row"><input id="vkv" value="' + cur + '" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type true or false"><button type="button" class="btn y" id="vku">Update</button></div>' +
    '<div class="vk-row"><button type="button" class="btn alt" data-v="true">true</button><button type="button" class="btn alt" data-v="false">false</button></div>' +
    '<span class="sm">Type <b>true</b> (students see it) or <b>false</b> (only you see it), then Update.</span>';
  document.body.append(m); VKM = m;
  m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + 'px'; m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + 'px';
  const inp = m.querySelector('#vkv'); inp.focus(); inp.select();
  const apply = () => {
    const v = inp.value.trim().toLowerCase();
    if (['true', 'yes', 'y', '1', 'on'].includes(v)) return vkSave(kind, id, true);
    if (['false', 'no', 'n', '0', 'off'].includes(v)) return vkSave(kind, id, false);
    toast('Type true or false', 1);
  };
  m.querySelector('#vku').onclick = apply; inp.onkeydown = e => { if (e.key == 'Enter') apply(); };
  m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { inp.value = b.dataset.v; apply(); });
}
function vkSave(kind, id, vis) {
  vkClose();
  run(async () => {
    if (kind == 'tab') await T('tab_visible_set', { sid, tb: id, vis }); else await T('item_visible_set', { kd: kind, i: id, vis });
    toast((kind == 'tab' ? 'Tab' : 'Card') + ': visible = ' + vis); await load();
  });
}
if (ADM) {
  document.addEventListener('contextmenu', e => {
    const el = e.target.closest && e.target.closest('[data-vk]'); if (!el) return;
    e.preventDefault(); if (!(VKS == 'touch' && Date.now() - VKT < 700)) vkOpen(el, e.clientX, e.clientY, 'mouse');
  });
  document.addEventListener('touchstart', e => {                                  // phone / tablet: press and hold
    const el = e.target.closest && e.target.closest('[data-vk]'); if (!el || e.touches.length != 1) return;
    const t0 = e.touches[0]; clearTimeout(VKL);
    VKL = setTimeout(() => { if (Date.now() - VKT > 700) vkOpen(el, t0.clientX, t0.clientY, 'touch'); }, 650);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(n => document.addEventListener(n, () => clearTimeout(VKL), { passive: true }));
  document.addEventListener('mousedown', e => { if (VKM && Date.now() - VKT > 400 && !VKM.contains(e.target)) vkClose(); });
  document.addEventListener('keydown', e => { if (e.key == 'Escape') vkClose(); });
}

/* e-mail: whenever the admin posts content (syllabus / lesson plan / material / notice / lab / video / task / format / exam / lab manual / meeting) -> the students of the subject get one e-mail. */
const sel = (id, arr, cur) => '<select id="' + id + '">' + arr.map(v => '<option' + (v == cur ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>';

const isOther = c => c == 'Other' || c == 'Other Syllabus';                  // v47: "Other" = the admin types the name (Materials and Syllabus)
function shareView(cats, L) {
  if (C.subject.kind != 'lab') cats = cats.filter(c => !/^Lab /.test(c));   // Lab Syllabus / Lab Lesson Plan only for Theory + Lab
  const by = {}, keys = [];                                                  // v46: a group = a category; for Other the group is the name the admin typed
  cats.forEach(c => C.materials.filter(m => m.category == c).forEach(m => { const g = isOther(c) ? (m.label || 'Other') : c; if (!by[g]) { by[g] = []; keys.push(g); } by[g].push(m); }));
  $('#pane').innerHTML =
    (ADM ? '<div class="card"><h3>' + L.add + '</h3>' +
      '<div class="mhead"><span>Category</span><span>Name</span><span>Drive link</span><span></span></div><div id="mrows"></div>' +
      '<div class="row"><button class="btn alt" id="mr">+ Add another row</button></div>' +
      '<div class="row"><button class="btn y" id="mp">' + L.post + '</button></div><p class="sm">When you post, every student of this subject gets one e-mail (information only, no links).</p></div>' : '') +
    (keys.map(c => '<h3 style="margin-top:20px">' + esc(c) + '</h3><div class="card" style="margin-top:8px">' +
      by[c].map(m => '<div class="li' + vkCls(m) + '"' + vkAttr('material', m) + '><div><b>' + esc(m.title) + '</b><span class="sm"> · ' + fmtDate(m.created_at) + '</span></div><div class="act">' +
        '<button class="btn" onclick="viewDoc(\'' + m.id + '\')">View</button>' +
        (ADM ? '<a class="btn alt" href="' + esc(m.link) + '" target="_blank" rel="noopener">Open in Drive</a>' : '') +
        (ADM ? '<button class="btn alt" onclick="delItem(\'material_del\',\'' + m.id + '\')">Delete</button>' : '') + '</div></div>').join('') + '</div>').join('') ||
      '<p class="sm" style="margin-top:16px">' + L.none + '</p>');
  if (ADM) {
    const addRow = () => { const d = document.createElement('div'); d.className = 'mrow';
      d.innerHTML = '<select class="mc" aria-label="Category">' + cats.map(c => isOther(c) ? '<option value="' + c + '">Other (type a name)</option>' : '<option>' + c + '</option>').join('') + '</select>' +
        '<input class="mt" aria-label="Name" placeholder="Name" autocomplete="off"><input class="ml" type="url" aria-label="Drive link" placeholder="https://drive.google.com/…" autocomplete="off">' +
        '<button type="button" class="btn alt xs" aria-label="Remove row" onclick="this.parentNode.remove()">✕</button>' +
        (L.other ? '<input class="mo" maxlength="60" aria-label="What is this? (for Other)" placeholder="Other: type the heading, e.g. Previous question papers" autocomplete="off" hidden>' : '');
      const mc = d.querySelector('.mc'), mo = d.querySelector('.mo'); if (mo) mc.onchange = () => { mo.hidden = !isOther(mc.value); if (!mo.hidden) mo.focus(); };
      $('#mrows').append(d); };
    addRow(); $('#mr').onclick = addRow;
    $('#mp').onclick = e => run(async () => {
      const rows = [...document.querySelectorAll('.mrow')].map(r => ({ category: r.querySelector('.mc').value, title: r.querySelector('.mt').value, link: r.querySelector('.ml').value, label: (r.querySelector('.mo') || { value: '' }).value.trim() })).filter(r => r.link.trim());
      if (!rows.length) throw Error('Paste at least one Drive link');
      if (rows.some(r => isOther(r.category) && !r.label)) throw Error('For Other, type what it is (example: Previous question papers)');
      await T('material_add', { sid, rw: rows });
      toast(L.done); await load();
      const msg = rows.map(r => '\u2022 ' + (isOther(r.category) ? r.label : r.category) + (r.title.trim() ? ' \u2013 ' + r.title.trim() : '')).join('\n') + '\n\nLog in and open the ' + L.tab + ' tab to view it.';
      toast(L.done + await mailPosted(sid, C.subject.code + ' \u2013 ' + L.what.toLowerCase() + ' posted', msg, L.head));
    }, e.target);
  }
}

const V = {
/* ===================== STUDENTS (admin + CR) ===================== */
students() {
  $('#pane').innerHTML =
    '<div class="card"><h3>Add student</h3><div class="form2">' +
      '<label class="fld"><span class="req">Name</span><input id="nm" maxlength="80" autocomplete="off"></label>' +
      '<label class="fld"><span class="req">Gmail (the student logs in with this)</span><input id="ea" type="email" autocomplete="off" placeholder="name@gmail.com"></label>' +
      '<label class="fld"><span class="req">Password (6+ characters)</span><input id="pwd" autocomplete="off"></label>' +
      '<label class="fld"><span class="req">Student mobile number</span><input id="mb" type="tel" inputmode="numeric" maxlength="13" autocomplete="off" placeholder="10 digits"></label>' +
      '<label class="fld">Reg No (optional)<input id="rg" maxlength="15" autocapitalize="characters" autocomplete="off" placeholder="5-15 letters/digits"></label>' +
      '<label class="fld">Parent mobile number (optional)<input id="pm" type="tel" inputmode="numeric" maxlength="13" autocomplete="off" placeholder="10 digits"></label>' +
      '<label class="fld">Year<select id="yr"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>' +
      '<label class="fld">Semester<select id="sm">' + [1, 2, 3, 4, 5, 6, 7, 8].map(v => '<option>' + v + '</option>').join('') + '</select></label>' +
    '</div><p class="sm">Required: name, Gmail, password and the student\'s mobile number. The student signs in with the <b>Gmail and password</b> (not the Reg No) and can change the password later.</p>' +
    '<div class="row"><button class="btn y" id="add">Add student</button></div>' +
    '<details open><summary>Upload students from Excel</summary><p class="sm">Excel (.xlsx / .xls) or .csv with the columns <b>Email, Name, Password, Mobile, Year, Semester</b> (required) and <b>RegNo, ParentMobile</b> (optional).</p>' +
      '<div class="row"><input type="file" id="xf" accept=".xlsx,.xls,.csv" aria-label="Excel file"><button class="btn" id="xi">Upload and add</button><button class="btn alt" id="xt">Download Excel template</button></div></details>' +
    '<details><summary>Add many students by typing</summary><p class="sm">One student per line:  Email, Name, Password, Mobile, Year, Semester, RegNo, ParentMobile   (RegNo and ParentMobile are optional)</p>' +
      '<textarea id="bulk"></textarea><div class="row"><button class="btn" id="addm">Add all</button></div></details></div>' +
    '<div class="row"><label class="fld">Search<input id="sq" autocomplete="off"></label>' +
      (ADM ? '<button class="btn alt" id="tp">Show passwords</button>' : '') + '</div>' +
    (ADM ? '<div class="row"><b>Download logins:</b><button class="btn alt" id="dx">Excel</button><button class="btn alt" id="dp">PDF</button><button class="btn alt" id="dw">Word</button></div>' : '') +
    '<div id="stt"></div>';
  stTable();
  $('#sq').oninput = e => { q = e.target.value; stTable(); };
  $('#add').onclick = e => run(async () => {
    await addStudents([{ regno: $('#rg').value, name: $('#nm').value, email: $('#ea').value, year: $('#yr').value, semester: $('#sm').value, mobile: $('#mb').value, parent_mobile: $('#pm').value, password: $('#pwd').value }]);
  }, e.target);
  $('#addm').onclick = e => run(async () => {
    const rows = $('#bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const c = l.split(/[,\t]/).map(x => x.trim());
      return { email: c[0], name: c[1], password: c[2], mobile: c[3], year: c[4], semester: c[5], regno: c[6] || '', parent_mobile: c[7] || '' }; });
    if (!rows.length) throw Error('Enter at least one line');
    await addStudents(rows);
  }, e.target);
  $('#xt').onclick = e => run(async () => { await lib(XLSX_URL); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Email', 'Name', 'Password', 'Mobile', 'Year', 'Semester', 'RegNo', 'ParentMobile']]), 'Students'); XLSX.writeFile(wb, 'students-template.xlsx'); }, e.target);
  $('#xi').onclick = e => run(async () => {
    const f = $('#xf').files[0]; if (!f) throw Error('Choose the Excel file first');
    await lib(XLSX_URL);
    const wb = XLSX.read(await f.arrayBuffer()), rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    const key = h => String(h).toLowerCase().replace(/[^a-z]/g, ''), pick = (r, names) => { for (const h in r) if (names.includes(key(h))) return String(r[h]).trim(); return ''; };
    const list = rows.map(r => ({ regno: pick(r, ['regno', 'registrationno', 'registerno', 'rollno', 'id']), name: pick(r, ['name', 'studentname']), email: pick(r, ['email', 'mail', 'emailid', 'gmail', 'gmailid']),
      year: pick(r, ['year', 'studyyear']), semester: pick(r, ['semester', 'sem', 'semno']),
      mobile: pick(r, ['mobile', 'mobileno', 'mobilenumber', 'phone', 'phoneno', 'studentmobile', 'studentmobileno']),
      parent_mobile: pick(r, ['parentmobile', 'parentmobileno', 'parentmobilenumber', 'parentsmobile', 'parentphone', 'parentphoneno', 'guardianmobile']), password: pick(r, ['password', 'pw', 'pass']) })).filter(r => r.regno || r.name || r.email);
    if (!list.length) throw Error('No student rows found. Columns needed: Email, Name, Password, Mobile, Year, Semester (RegNo and ParentMobile optional)');
    if (!confirm('Add ' + list.length + ' student(s) from this file?')) return;
    await addStudents(list);
  }, e.target);
  if (ADM) {
    $('#dx').onclick = e => run(() => dl('xlsx'), e.target); $('#dp').onclick = e => run(() => dl('pdf'), e.target); $('#dw').onclick = e => run(() => dl('doc'), e.target);
    $('#tp').onclick = e => { showPw = !showPw; e.target.textContent = (showPw ? 'Hide' : 'Show') + ' passwords'; stTable(); };
  }
},

/* ===================== SYLLABUS / LESSON PLAN / MATERIALS / MARKS SHARE / LAB SHEET (Drive links, same table, different categories) ===================== */
syllabus() { shareView(SYL_CATS, { other: true, add: 'Add syllabus (Google Drive link)' + (C.subject.kind == 'lab' ? ' – Theory Syllabus, Lab Syllabus or Other' : ' – or choose Other and type a name'), post: 'Post syllabus', none: 'No syllabus posted yet.', what: 'New syllabus', head: 'Syllabus', tab: 'Syllabus', done: 'Syllabus posted' }); },

      '<div class="row" style="margin:0"><button class="btn ' + (made ? 'alt' : 'y') + '" id="bmk">' + (made ? '✎ Edit batches' : '+ Create batches') + '</button></div>') + '</div>';
  const form = !ADM || BT === null || !made ? '' : '<div class="card"><h3>Add lab program</h3>' +
    '<div class="fld"><label id="lbl">Batch</label><div class="bsel" role="radiogroup" aria-labelledby="lbl">' + [1, 2].map(b => { const c = bRegs(b).length;

      '<label class="bopt both' + (n1 && n2 ? '' : ' off') + '" style="--bc:#0b2a5b;--bi:#ffffff"><input type="radio" name="lbt" value="both"' + (n1 && n2 ? '' : ' disabled') + '><span><b>Both batches</b><small>' + (n1 + n2) + ' student(s)</small></span></label></div></div>' +
    '<div class="form2" style="margin-top:14px">' +
      '<label class="fld">Lab number<select id="lx">' + nums.map(v => '<option value="' + v + '">Lab ' + v + '</option>').join('') + '<option value="other">Other number…</option></select>' +

    '<label class="fld">Drive link<input id="ll" type="url" autocomplete="off"></label></div>' +
    '<label class="fld" style="margin-top:14px">Program (code)<textarea id="lpg" class="mono" rows="8" spellcheck="false"></textarea></label>' +
    '<label class="fld" style="margin-top:14px">What to do (assignment)<textarea id="lk"></textarea></label>' +
    '<div class="row"><button class="btn y" id="lp">Post lab program</button><span class="sm" id="lpn"></span></div></div>';
  const filt = ADM || ROLE == 'cr' ? (made ? '<div class="bfilter"><b>Show:</b>' + [['', 'All'], ['1', 'Batch 1'], ['2', 'Batch 2']].map(f => '<button type="button" class="bf' + (LBF == f[0] ? ' on' : '') + '"' + (f[0] ? ' style="--bc:' + bCol(f[0]) + ';--bi:' + inkOn(bCol(f[0])) + '"' : '') + ' data-b="' + f[0] + '">' + f[1] + '</button>').join('') + '</div>' : '') :

  $('#pane').innerHTML = bcard + form + filt +
    (list.map(({ l, ix }) => '<div class="card item lcard' + vkCls(l) + '"' + vkAttr('lab', l) + ' style="--bc:' + (l.batch ? bCol(l.batch) : '#cbd5e1') + '"><div class="li"><div><h3 style="margin:0">' + (l.exp_no ? 'Lab ' + esc(String(l.exp_no).replace(/^(lab|exp)\s*/i, '')) + ' – ' : '') + esc(l.title) + '</h3>' +
      (STU && mine ? '' : bPill(l.batch) + ' ') + (l.lab_date ? '<span class="pill ok">' + fmtDate(l.lab_date) + '</span> ' : '') + (l.slot ? '<span class="pill">' + esc(l.slot) + '</span> ' : (l.lab_time ? '<span class="pill">' + fmtTime(l.lab_time) + '</span> ' : '')) +
      (l.location ? '<span class="pill wait">' + esc(l.location) + '</span> ' : '') + '<span class="sm">Posted ' + fmtDT(l.created_at) + '</span></div><div class="act">' +
      (l.link ? '<a class="btn" href="' + esc(l.link) + '" target="_blank" rel="noopener">Open Drive link</a>' : '') +
      (l.program ? '<button class="btn alt" onclick="copyProg(' + ix + ')">Copy program</button>' : '') +
      (ADM ? '<button class="btn alt" onclick="delItem(\'lab_del\',\'' + l.id + '\')">Delete</button>' : '') + '</div></div>' +
      (l.task ? '<p class="pre"><b>What to do:</b>\n' + esc(l.task) + '</p>' : '') +

  document.querySelectorAll('.bf').forEach(b => b.onclick = () => { LBF = b.dataset.b; V.labs(); });
  if (!ADM) return;
  if ($('#bmk')) $('#bmk').onclick = () => batchModal();
  if (!$('#lp')) return;
  const first = document.querySelector('input[name=lbt]:not(:disabled)'); if (first) first.checked = true;
  const note = () => { const b = document.querySelector('input[name=lbt]:checked'); $('#lpn').textContent = !b ? '' : b.value == 'both' ? 'The e-mail goes to all ' + (n1 + n2) + ' student(s) of Batch 1 and Batch 2.' : 'The e-mail goes only to the ' + bRegs(b.value).length + ' student(s) of Batch ' + b.value + '.'; };
  document.querySelectorAll('input[name=lbt]').forEach(r => r.onchange = note); note();
  $('#lx').onchange = e => { $('#lxo').hidden = e.target.value != 'other'; };
  $('#lp').onclick = e => run(async () => {
    const bt = (document.querySelector('input[name=lbt]:checked') || {}).value;
    const x = $('#lx').value == 'other' ? $('#lxo').value.trim() : $('#lx').value, t = $('#lt').value.trim(), d = $('#ld').value, slot = $('#lslot').value, loc = $('#lloc').value.trim(),
      k = $('#lk').value.trim(), l = $('#ll').value.trim(), pg = $('#lpg').value;
    if (!bt) throw Error('Choose the batch (Batch 1, Batch 2 or Both batches)');
    if (!/^\d{1,3}$/.test(x)) throw Error('Choose or type the lab number');
    if (!d) throw Error('Choose the lab date');
    const bts = bt == 'both' ? [1, 2] : [Number(bt)], who = bt == 'both' ? 'Batch 1 and Batch 2' : 'Batch ' + bt;       // 'Both batches' = the same program is posted once for each batch
    try { for (const b of bts) await T('lab_add', { sid, ex: x, ti: t, task: k, prog: pg, d, slot, loc, lk: l, bt: b }); }
    catch (er) { throw /lab_add|schema cache/i.test(er.message || '') ? Error('Run the new SQL file 16_lab_batches.sql once in Supabase (see README), then try again.') : er; }
    await load();
    const msg = who + '\nLab ' + x + (t ? ' – ' + t : '') + '\nDate: ' + fmtDate(d) + '\nTime: ' + slot + (loc ? '\nLab location: ' + loc : '') + (k ? '\n\nWhat to do:\n' + k : '');
    toast('Lab program posted for ' + who + await mailPosted(sid, C.subject.code + ' – ' + who + ' – Lab ' + x + ' on ' + fmtDate(d), msg, 'Lab Program', undefined, bts.flatMap(bRegs), who));
  }, $('#lp'));
},

/* ---------- actions ---------- */
async function addStudents(rows) {
  const r = await T('students_add', { sid, rw: rows }), msg = [];
  if (r.added.length) msg.push(r.added.length + ' added');
  if (r.existing.length) msg.push(r.existing.length + ' already had an account and were added to this subject');
  if (r.skipped.length) msg.push(r.skipped.length + ' skipped: ' + r.skipped.map(x => (x.email || '?') + ' (' + x.why + ')').join('; '));
  toast(msg.join(' · '), !r.added.length && !r.existing.length);
  await load();
}

function editSt(i) {
  const s = stu(i);
  modal('<h3>Edit student</h3>' +
    '<label class="fld"><span class="req">Name</span><input id="e2" value="' + esc(s.name) + '"></label>' +
    '<label class="fld"><span class="req">Gmail</span><input id="e3" type="email" value="' + esc(s.email) + '"></label>' +

    '<label class="fld">Year' + sel('e4', [1, 2, 3, 4], s.year) + '</label>' +
    '<label class="fld">Semester' + sel('e8', (s.semester ? [] : ['']).concat([1, 2, 3, 4, 5, 6, 7, 8]), s.semester) + '</label>' +

    '<label class="fld"><span class="req">Password</span><input id="e5" value="' + esc(s.pw) + '"></label><p class="sm">At least 6 characters. If the student chose the password, it is not shown; type a new one only to replace it.</p>' +
    '<div class="row" style="margin:0"><button class="btn y" id="e7">Save</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>');
  $('#e7').onclick = e => run(async () => {
    /* read every field BEFORE the popup is closed (closing removes the inputs) */
    const v = { rg: $('#e1').value, n: $('#e2').value, e: $('#e3').value, y: parseInt($('#e4').value), sm: parseInt($('#e8').value), mb: $('#e9').value, pm: $('#e10').value, p: $('#e5').value.trim() };
    await T('student_edit', { i, rg: v.rg, n: v.n, e: v.e, y: v.y, sm: v.sm, mb: v.mb, pm: v.pm });
    if (v.p && v.p !== s.pw) await T('student_reset', { i, p: v.p });
    closeModal(); toast('Saved'); await load();
  }, e.target);
}
function resetSt(i) {
  const s = stu(i), mob = s.mobile;
  if (!mob) return toast('This student has no mobile number saved. Use Edit and type a new password.', 1);
  if (!confirm('Reset the password of ' + s.name + ' to the mobile number (' + mob + ')?')) return;
  run(async () => { await T('student_reset', { i, p: mob }); toast('Password is now ' + mob); await load(); });
}
function rmSt(i) {
  const s = stu(i);
  if (!confirm('Remove ' + s.name + ' (' + s.email + ') from ' + C.subject.code + '?\nThe account is deleted if the student is in no other subject.')) return;
  run(async () => { await T('student_remove', { sid, ids: [i] }); toast('Removed'); await load(); });
}

/* ---------- protected viewer: PDF / Word / PPT / Excel Drive links open INSIDE the site (no download, no print, no copy) ---------- */
function embedUrl(u) {
  let m = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
  if (m) return 'https://docs.google.com/' + m[1] + '/d/' + m[2] + '/preview';
  m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
  return m ? 'https://drive.google.com/file/d/' + m[1] + '/preview' : '';
}
let _vk = null;
function viewDoc(id) {
  const m = C.materials.find(x => x.id == id); if (!m) return;
  const src = embedUrl(m.link);
  if (!src) { window.open(m.link, '_blank', 'noopener'); return; }          // not a Google Drive link: opens normally
  openViewer(m.title, src);
}
/* a submitted task: the Drive link is fetched only to be shown in the viewer; it is never printed on the page */
function tkView(subId) {
  run(async () => {
    const r = await T('task_link', { i: subId }), src = embedUrl(r.link);
    if (!src) throw Error('This file cannot be shown here. Ask the student to share the file link again.');
    openViewer(r.title, src);
  });
}
function openViewer(title, src) {  const who = (localStorage.ng_name || ROLE || '') + ' · ' + C.subject.code,
    wm = "url(\"data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200"><text x="20" y="110" font-family="Arial" font-size="18" fill="#0a1b45" fill-opacity="0.13" transform="rotate(-24 180 100)">' + who.replace(/[<>&"']/g, '') + '</text></svg>') + "\")";
  closeViewer();
  const v = document.createElement('div'); v.id = 'viewer';
  v.innerHTML = '<div class="vbar"><b>' + esc(title) + '</b><button class="btn y" onclick="closeViewer()">Close</button></div>' +
    '<div class="vwrap"><iframe src="' + src + '" sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer" allow="fullscreen" title="Document"></iframe>' +
    '<div class="vblock"></div><div class="vmark" style="background-image:' + wm + '"></div></div>';
  document.body.append(v); document.body.classList.add('viewing');
  const stop = e => e.preventDefault();
  _vk = { stop, key: e => { const k = e.key.toLowerCase(); if (k == 'printscreen' || k == 'escape' && 0 || (e.ctrlKey || e.metaKey) && 'pscaxu'.includes(k)) e.preventDefault(); if (k == 'escape') closeViewer(); } };
  ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(t => document.addEventListener(t, _vk.stop));
  document.addEventListener('keydown', _vk.key);
}
/* ---------- v47: any link (exam website, Google Form, Drive file or folder) opens INSIDE the site, in a full-screen frame with a Close button ---------- */
function embedAny(u) {
  const d = embedUrl(u); if (d) return d;                                                           // Drive file / Doc / Slides / Sheet -> protected preview
  let m = u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:drive\/)?folderview\?(?:[^#]*&)?id=([\w-]+)/);
  if (m) return 'https://drive.google.com/embeddedfolderview?id=' + m[1] + '#list';                  // Drive folder
  if (/^https:\/\/docs\.google\.com\/forms\//i.test(u) && !/[?&]embedded=true/.test(u)) return u + (u.includes('?') ? '&' : '?') + 'embedded=true';   // Google Form
  return u;
}
function openFrame(title, url) {
  closeViewer();
  const v = document.createElement('div'); v.id = 'viewer';
  v.innerHTML = '<div class="vbar"><b>' + esc(title) + '</b><span><a class="vopen" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Not loading? Open in new tab</a> <button class="btn y" onclick="closeViewer()">Close</button></span></div>' +
    '<div class="vwrap"><iframe src="' + esc(embedAny(url)) + '" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads" referrerpolicy="no-referrer" allow="fullscreen; camera" title="' + esc(title) + '"></iframe></div>';
  document.body.append(v); document.body.classList.add('viewing');
  _vk = { stop() {}, key: e => { if (e.key == 'Escape') closeViewer(); } };
  document.addEventListener('keydown', _vk.key);
}
function openItem(kind, id) {
  const x = (kind == 'exam' ? EL : LM || []).find(o => o.id == id); if (!x) return;
  if (kind == 'lab' && embedUrl(x.link)) return openViewer(x.title, embedUrl(x.link));              // lab manual (Drive file): protected viewer
  openFrame(x.title, x.link);
}
function closeViewer() {
  const v = $('#viewer'); if (v) v.remove(); document.body.classList.remove('viewing');
  if (_vk) { ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(t => document.removeEventListener(t, _vk.stop)); document.removeEventListener('keydown', _vk.key); _vk = null; }
}

/* ---------- rich text box for notices: bold, italic, underline, alignment, bullets, numbers ---------- */
function rteBar() {
  const b = (cmd, label, title, arg) => '<button type="button" class="rb" title="' + title + '" aria-label="' + title + '" onmousedown="event.preventDefault()" onclick="rteCmd(\'' + cmd + '\'' + (arg ? ',\'' + arg + '\'' : '') + ')">' + label + '</button>';
  return '<div class="rte-bar" role="toolbar" aria-label="Text formatting">' +
    b('bold', '<b>B</b>', 'Bold') + b('italic', '<i>I</i>', 'Italic') + b('underline', '<u>U</u>', 'Underline') + '<span class="rsep"></span>' +
    b('justifyLeft', '⬑ Left', 'Align left') + b('justifyCenter', 'Center', 'Align centre') + b('justifyRight', 'Right', 'Align right') + b('justifyFull', 'Justify', 'Justify') + '<span class="rsep"></span>' +
    b('insertUnorderedList', '• Bullets', 'Bullet list') + b('insertOrderedList', '1. Numbers', 'Numbered list') + '<span class="rsep"></span>' +
    b('formatBlock', 'Heading', 'Heading', 'H3') + b('formatBlock', 'Normal', 'Normal text', 'P') + b('removeFormat', 'Clear', 'Remove formatting') + '</div>';

function rteCmd(cmd, arg) { const ed = $('#ni'); if (!ed) return; ed.focus(); document.execCommand(cmd, false, arg || null); }
function rteInit() {
  const ed = $('#ni'); if (!ed) return;
  document.execCommand('defaultParagraphSeparator', false, 'div');
  ed.addEventListener('paste', e => {                                    // paste as plain text (no foreign styles)
    e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  });
}

function batchModal() {
  if (!ST.length) return toast('Add students to this subject first (Students tab)', 1);
  const cur = {}; (BT ? BT.rows : []).forEach(r => cur[r.student_id] = r.batch);
  modal('<h3>Lab batches · ' + esc(C.subject.code) + '</h3>' +
    '<p class="sm">Put every student in <b>Batch 1</b> or <b>Batch 2</b>. A student can be in only one batch. Students left as “No batch” do not see new lab programs.</p>' +
    '<div class="form2" style="margin:10px 0"><label class="fld">Batch 1 color<input type="color" id="bc1" value="' + bCol(1) + '"></label><label class="fld">Batch 2 color<input type="color" id="bc2" value="' + bCol(2) + '"></label></div>' +
    '<div class="form2"><label class="fld">Batch 1 – Reg Nos / Gmails<textarea id="br1" rows="3" class="mono" placeholder="Paste Reg Nos (comma, space or new line)"></textarea></label>' +
      '<label class="fld">Batch 2 – Reg Nos / Gmails<textarea id="br2" rows="3" class="mono" placeholder="Paste Reg Nos (comma, space or new line)"></textarea></label></div>' +
    '<div class="row" style="margin:8px 0"><button type="button" class="btn alt" id="bap">Apply the typed Reg Nos</button><button type="button" class="btn alt" id="bhf">Split in half</button><button type="button" class="btn alt" id="bcl">Clear all</button></div>' +
    '<label class="fld">Search<input id="bq" autocomplete="off" placeholder="Reg No or name"></label>' +
    '<p class="sm" id="bsum" style="margin:8px 0 4px"></p>' +
    '<div class="pick" style="max-height:300px">' + ST.map(s => '<div class="brow" data-q="' + esc((ident(s) + ' ' + s.name).toLowerCase()) + '"><span><b>' + esc(ident(s)) + '</b> ' + esc(s.name) + '</span>' +
      '<select class="bs" data-id="' + s.id + '" data-r="' + esc(ident(s)) + '"><option value="">No batch</option><option value="1"' + (cur[s.id] == 1 ? ' selected' : '') + '>Batch 1</option><option value="2"' + (cur[s.id] == 2 ? ' selected' : '') + '>Batch 2</option></select></div>').join('') + '</div>' +
    '<div class="row" style="margin:14px 0 0"><button class="btn y" id="bsv">Save batches</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>');
  const sels = () => [...document.querySelectorAll('.bs')];
  const sum = () => { const c = { 1: 0, 2: 0, '': 0 }; sels().forEach(x => c[x.value]++); $('#bsum').innerHTML = bPill(1, 'Batch 1 · ' + c[1]) + ' ' + bPill(2, 'Batch 2 · ' + c[2]) + ' <span class="sm">No batch · ' + c[''] + '</span>'; };
  sum();
  document.querySelector('.pick').onchange = sum;
  $('#bq').oninput = e => { const v = e.target.value.trim().toLowerCase(); document.querySelectorAll('.brow').forEach(r => r.hidden = v && !r.dataset.q.includes(v)); };
  $('#bap').onclick = () => {
    const miss = [], seen = new Set();
    [1, 2].forEach(b => { String($('#br' + b).value).toUpperCase().split(/[\s,;]+/).filter(Boolean).forEach(rg => {
      const x = sels().find(o => o.dataset.r.toUpperCase() == rg); if (!x) return miss.push(rg);
      if (seen.has(rg)) return; seen.add(rg); x.value = String(b); }); });
    sum(); toast(miss.length ? 'Not in this subject: ' + miss.slice(0, 6).join(', ') + (miss.length > 6 ? '…' : '') : 'Reg Nos applied. Press Save batches.', !!miss.length);
  };
  $('#bhf').onclick = () => { const a = sels(), h = Math.ceil(a.length / 2); a.forEach((x, i) => x.value = i < h ? '1' : '2'); sum(); };
  $('#bcl').onclick = () => { sels().forEach(x => x.value = ''); sum(); };
  $('#bsv').onclick = e => run(async () => {
    const rw = sels().filter(x => x.value).map(x => ({ student_id: x.dataset.id, batch: Number(x.value) })), colors = { 1: $('#bc1').value, 2: $('#bc2').value };
    if (!rw.some(r => r.batch == 1) && !rw.some(r => r.batch == 2)) { if (!confirm('No student is in a batch. Save anyway?')) return; }
    if (colors[1].toLowerCase() == colors[2].toLowerCase()) throw Error('Give the two batches different colors');
    try { await T('batches_save', { sid, rw, colors }); }
    catch (er) { throw /batches_save|schema cache/i.test(er.message || '') ? Error('Run the new SQL file 16_lab_batches.sql once in Supabase (see README), then try again.') : er; }
    closeModal(); toast('Batches saved'); await load();
  }, e.target);
}

/* ---------- TASKS ---------- */
let TK = [], TKOPEN = null;
const MAXDOC = 3 * 1024 * 1024;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const fileB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(Error('The file could not be read')); r.readAsDataURL(f); });

/* v41: the deadline is one field; a submission after it is "Late" (it is still accepted).  k = task, at = a date or a time stamp, sub = true when at is the time of a submission */
function isLate(k, at, sub) {
  const dl = k.deadline ? new Date(k.deadline) : k.due_date ? new Date(String(k.due_date).slice(0, 10) + 'T23:59:59') : null;
  return !!(dl && at && new Date(at) > dl);
}
const btnForm = (k, label) => '<div class="tk-up"><button class="btn y" onclick="tkBtn(\'' + k.id + '\',this)">' + label + '</button></div>' +
  '<p class="sm" style="margin:6px 0 0">Press the button when you have finished this task. ' + (k.deadline ? 'Deadline: ' + fmtDT(k.deadline) + '.' : '') + '</p>';
function tkBtn(id, btn) {
  if (!confirm('Submit this task now?')) return;
  run(async () => { await T('task_submit_button', { tid: id }); toast('Submitted'); await tasksView(); }, btn);
}

function tkDownload(subId) {
  run(async () => {
    const f = await T('task_file', { i: subId }), bin = atob(f.file_data), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type: /\.docx$/i.test(f.file_name) ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/msword' }));
    a.download = f.file_name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
}

  TKOPEN = id; box.innerHTML = '<p class="sm" style="margin-top:12px">Loading…</p>';
  try {

/* ---------- Google Drive links: open + direct download ---------- */
const driveId = u => (String(u).match(/\/d\/([\w-]{10,})/) || String(u).match(/[?&]id=([\w-]{10,})/) || [])[1];
function driveDl(u) {
  const id = driveId(u); if (!id) return null;
  if (/docs\.google\.com\/document/.test(u)) return 'https://docs.google.com/document/d/' + id + '/export?format=docx';
  if (/docs\.google\.com\/spreadsheets/.test(u)) return 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=xlsx';
  if (/docs\.google\.com\/presentation/.test(u)) return 'https://docs.google.com/presentation/d/' + id + '/export/pptx';
  return 'https://drive.google.com/uc?export=download&id=' + id;
}
const lkBtns = u => '<a class="btn alt" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">Open</a>' +
  (driveDl(u) ? '<a class="btn" href="' + esc(driveDl(u)) + '" target="_blank" rel="noopener noreferrer">Download</a>' : '<span class="sm">Folder: open it to download</span>');
const lkForm = (id, label) => '<div class="tk-up"><input type="url" id="tl' + id + '-' + label[0] + '" placeholder="https://drive.google.com/…" aria-label="Google Drive link" autocomplete="off"><button class="btn y" onclick="tkLink(\'' + id + '\',\'' + label[0] + '\',this)">' + label + '</button></div>' +
  '<p class="sm" style="margin:6px 0 0">Link of your <b>file</b> (Word / PPT / PDF) in Google Drive, not a folder. Share it as “Anyone with the link”, then paste it here. Nobody sees the link: it is opened with <b>View</b> inside this site.</p>';
function tkLink(id, w, btn) {
  run(async () => {
    const v = ($('#tl' + id + '-' + w).value || '').trim();
    if (!v) throw Error('Paste your Google Drive link first');
    if (!/^https:\/\/(drive|docs)\.google\.com\//i.test(v)) throw Error('Only a Google Drive link is accepted (https://drive.google.com/…)');
    if (!/\/d\/[\w-]{10,}|[?&]id=[\w-]{10,}/.test(v)) throw Error('Paste the link of the FILE, not of a folder.');
    await T('task_submit_link', { tid: id, lk: v }); toast('Submitted'); await tasksView();
  }, btn);
}

    toast(EXK[kd] + ' link posted' + await mailPosted(sid, C.subject.code + ' – ' + EXK[kd] + ': ' + t, EXK[kd] + ': ' + t + '\n\nLog in and open the Exams tab to open it.', EXK[kd], '<p><b>' + esc(EXK[kd]) + ':</b> ' + esc(t) + '</p><p>Log in and open the Exams tab to open it.</p>'));
  }, e.target);
}

/* ---------- LAB MANUAL (v46): Name + Google Drive link + optional note; for everybody or (optional) one batch ---------- */
function labManualPane() {
  if (LM === null) { $('#pane').innerHTML = sqlMissing; return; }
  const n1 = bRegs(1).length, n2 = bRegs(2).length, made = n1 + n2 > 0, mine = STU && BT && BT.rows.length ? BT.rows[0].batch : null;
  const bopt = (v, name, sub, dis, col, ink) => '<label class="bopt' + (dis ? ' off' : '') + (v == 0 ? ' both' : '') + '" style="--bc:' + col + ';--bi:' + ink + '"><input type="radio" name="lmb" value="' + v + '"' + (dis ? ' disabled' : '') + (v == 0 ? ' checked' : '') + '><span><b>' + name + '</b><small>' + sub + '</small></span></label>';
  const form = !ADM ? '' : '<div class="card"><h3>Post lab manual</h3><div class="form2">' +
    '<label class="fld"><span class="req">Name</span><input id="lmt" maxlength="120" placeholder="e.g. DS Lab Manual" autocomplete="off"></label>' +
    '<label class="fld"><span class="req">Google Drive link</span><input id="lml" type="url" placeholder="https://drive.google.com/…" autocomplete="off"></label></div>' +
    '<label class="fld" style="margin-top:14px">Other mention (optional)<input id="lmn" maxlength="300" placeholder="e.g. Print it and bring it to the lab" autocomplete="off"></label>' +
    (BT === null ? '' : '<div class="fld" style="margin-top:14px"><label id="lmbl">Who sees it? (batches are optional)</label><div class="bsel" role="radiogroup" aria-labelledby="lmbl">' +
      bopt(0, 'All students', (ST.length) + ' student(s)', false, '#0b2a5b', '#ffffff') + bopt(1, 'Batch 1', n1 + ' student(s)', !n1, bCol(1), inkOn(bCol(1))) + bopt(2, 'Batch 2', n2 + ' student(s)', !n2, bCol(2), inkOn(bCol(2))) + '</div>' +
      '<p class="sm" style="margin:8px 0 0">' + (made ? 'Only the chosen batch sees it and gets the e-mail.' : 'No batches yet. To post for one batch, create the batches first (optional).') +
      ' <button type="button" class="btn alt xs" id="lmmk">' + (made ? '✎ Edit batches' : '+ Create batches') + '</button></p></div>') +
    '<div class="row"><button class="btn y" id="lmp">Post lab manual</button></div></div>';
  const note = STU && mine ? '<p style="margin:0 0 12px">You are in ' + bPill(mine) + '</p>' : '';
  $('#pane').innerHTML = form + note + (LM.map(x => '<div class="card wk' + vkCls(x) + '"' + vkAttr('labmanual', x) + '><div class="tk-top"><div><h3 style="margin:0">' + esc(x.title) + '</h3>' +
      (STU && mine ? '' : bPill(x.batch) + ' ') + '<span class="sm">Posted ' + fmtDT(x.created_at) + '</span></div>' +
      (ADM ? '<div class="act"><button class="btn alt" onclick="delItem(\'labmanual_del\',\'' + x.id + '\')">Delete</button></div>' : '') + '</div>' +
      (x.note ? '<p class="pre" style="margin:10px 0 0">' + esc(x.note) + '</p>' : '') + '<div class="lk" style="margin-top:12px"><button class="btn y" onclick="openItem(\'lab\',\'' + x.id + '\')">Open lab manual</button></div></div>').join('') ||
    '<p class="sm" style="margin-top:16px">No lab manual posted yet.</p>');
  if (!ADM) return;
  if ($('#lmmk')) $('#lmmk').onclick = () => batchModal();
  $('#lmp').onclick = e => run(async () => {
    const t = $('#lmt').value.trim(), l = $('#lml').value.trim(), nt = $('#lmn').value.trim(), bt = Number((document.querySelector('input[name=lmb]:checked') || {}).value || 0);
    if (!t) throw Error('Enter the name of the lab manual');
    if (!/^https:\/\/(drive|docs)\.google\.com\//i.test(l)) throw Error('Only a Google Drive link is accepted (https://drive.google.com/…)');
    await T('labmanual_add', { sid, ti: t, nt, lk: l, bt });
    toast('Lab manual posted'); await load();
    const who = bt ? 'Batch ' + bt : '';
    toast('Lab manual posted' + await mailPosted(sid, C.subject.code + ' – new lab manual: ' + t, (who ? who + '\n' : '') + t + (nt ? '\n' + nt : '') + '\n\nLog in and open the Lab Manual tab.', 'Lab Manual', '<p>' + (who ? '<b>' + who + '</b><br>' : '') + esc(t) + (nt ? '<br>' + esc(nt) : '') + '</p><p>Log in and open the Lab Manual tab.</p>', bt ? bRegs(bt) : undefined, who || undefined));
  }, e.target);
}

/* ---------- ZOOM MEETING (v46): Title + meeting link (+ optional date and time); students press Join, it opens in a new page ---------- */
function meetingsPane() {
  if (MT === null) { $('#pane').innerHTML = sqlMissing; return; }
  const form = !ADM ? '' : '<div class="card"><h3>Post a meeting link</h3><div class="form2">' +
    '<label class="fld"><span class="req">Title</span><input id="mtt" maxlength="120" placeholder="e.g. Doubt clearing class" autocomplete="off"></label>' +
    '<label class="fld"><span class="req">Zoom / Meet link</span><input id="mtl" type="url" placeholder="https://zoom.us/j/…" autocomplete="off"></label>' +
    '<label class="fld">Date and time (optional)<input id="mtd" type="datetime-local"></label></div>' +
    '<p class="sm" style="margin-top:10px">Zoom, Google Meet, Teams – any meeting link. Students press <b>Join</b> and it opens in a new page. Every student of this subject gets a notification and an e-mail.</p>' +
    '<div class="row"><button class="btn y" id="mtp">Post meeting</button></div></div>';
  $('#pane').innerHTML = form + (MT.map(m => { const up = m.starts_at && new Date(m.starts_at) > new Date();
    return '<div class="card wk' + vkCls(m) + '"' + vkAttr('meeting', m) + '><div class="tk-top"><div><h3 style="margin:0">' + esc(m.title) + '</h3>' +
      (m.starts_at ? '<span class="pill ' + (up ? 'ok' : '') + '">' + fmtDT(m.starts_at) + (up ? ' · upcoming' : '') + '</span> ' : '') + '<span class="sm">Posted ' + fmtDT(m.created_at) + '</span></div>' +
      '<div class="act">' + openBtn(m.link, 'Join meeting') + (ADM ? '<button class="btn alt" onclick="delItem(\'meeting_del\',\'' + m.id + '\')">Delete</button>' : '') + '</div></div></div>'; }).join('') ||
    '<p class="sm" style="margin-top:16px">No meeting posted yet.</p>');
  if (ADM) $('#mtp').onclick = e => run(async () => {
    const t = $('#mtt').value.trim(), l = $('#mtl').value.trim(), d = $('#mtd').value, st = d ? new Date(d).toISOString() : '';
    if (!t) throw Error('Enter the meeting title'); if (!isHttp(l)) throw Error('Paste a valid meeting link (starting with https://)');
    await T('meeting_add', { sid, ti: t, lk: l, st });
    toast('Meeting posted'); await load();
    toast('Meeting posted' + await mailPosted(sid, C.subject.code + ' – meeting: ' + t, t + (st ? '\nDate and time: ' + fmtDT(st) : '') + '\n\nLog in and open the Zoom Meeting tab to join.', 'Meeting', '<p><b>' + esc(t) + '</b></p>' + (st ? '<p>Date and time: ' + esc(fmtDT(st)) + '</p>' : '') + '<p>Log in and open the Zoom Meeting tab to join.</p>'));
  }, e.target);
}

function copyProg(ix) { navigator.clipboard.writeText(C.labs[ix].program).then(() => toast('Program copied'), () => toast('Could not copy', 1)); }
function delItem(fn, i) { if (!confirm('Delete this item?')) return; run(async () => { await T(fn, { i }); await load(); }); }

if (needLogin()) {
  (async () => {
    const list = await T('subjects_list');                                   // find the subject from the code in the address
    const s = URLSUB.code ? list.find(x => x.code.toUpperCase() == URLSUB.code) : list.find(x => x.id == URLSUB.id);
    if (!s) { buildShell('dash'); $('#main').innerHTML = '<p class="note bad-note">Subject not found, or it is not assigned to you. <a href="' + page('dashboard') + '">Go to the dashboard</a></p>'; return; }
    sid = s.id; buildShell('sub:' + s.code);
    await load();
  })().catch(e => { $('#main').innerHTML = '<p class="note bad-note">' + esc(e.message) + '</p>'; });
}
</script>
</body>
</html>
